services:
  octopus:
    # 本仓库 CI 自动构建的镜像（push 到 master 即更新）
    # 国内服务器拉不动 ghcr 时，改用镜像站：
    #   ghcr.nju.edu.cn/salem-2007/octopus:dev
    # 固定版本可换 tag：dev / sha-<短hash> / v<release号> / latest
    image: ghcr.io/salem-2007/octopus:dev
    container_name: octopus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - octopus-data:/app/data
    environment:
      # 容器时区；海外部署可改为显式 IANA 时区名，例如 America/Los_Angeles
      TZ: "Asia/Shanghai"

      # ↓ 必填，否则容器会拒绝启动（防止重启后已加密数据永久不可解）
      # octopus 要求 security.encryption_key 或一个持久的 auth.jwt_secret 二者其一。
      # 两个都配上最稳：encryption_key 负责加密渠道密钥，jwt_secret 负责登录令牌。
      # 生成： openssl rand -hex 32
      OCTOPUS_SECURITY_ENCRYPTION_KEY: ${OCTOPUS_SECURITY_ENCRYPTION_KEY:?先在 .env 里设置 OCTOPUS_SECURITY_ENCRYPTION_KEY}
      OCTOPUS_AUTH_JWT_SECRET: ${OCTOPUS_AUTH_JWT_SECRET:?先在 .env 里设置 OCTOPUS_AUTH_JWT_SECRET}

      # 反向代理 / Docker bridge 部署：默认不信任代理，client_ip 会是网关地址（如 172.17.0.1）。
      # 配置代理网段以解析真实客户端 IP，例如默认 Docker bridge 用 172.17.0.0/16
      # OCTOPUS_SERVER_TRUSTED_PROXIES: "172.17.0.0/16"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  octopus-data:
